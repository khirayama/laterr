name: Release

# Pushing a tag such as v0.1.0 builds the binaries and publishes a GitHub
# release with them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Check
        run: make check
      - name: Check macOS vulnerabilities
        run: GOOS=darwin GOARCH=arm64 make vulncheck
      - name: Build
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*} arch=${target#*/}
            name=laterr_${version}_${os}_${arch}
            mkdir "build-$name"
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "build-$name/laterr" ./cmd/laterr
            cp README.md LICENSE "build-$name/"
            tar -czf "dist/$name.tar.gz" -C "build-$name" laterr README.md LICENSE
          done
          cd dist && sha256sum *.tar.gz > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
